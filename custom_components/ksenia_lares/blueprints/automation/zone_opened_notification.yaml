blueprint:
  name: Ksenia Lares - Zone Opened Notification
  description: >
    Send a notification when a specific zone (door/window) is opened on the Ksenia Lares alarm system.
    Useful for monitoring entry points when alarm is armed or disarmed.
  domain: automation
  source_url: https://github.com/chiuky/ha-ksenia-lares/blob/main/custom_components/ksenia_lares/blueprints/automation/zone_opened_notification.yaml

  input:
    zone_device:
      name: Zone Device
      description: The Ksenia Lares zone (door/window sensor) to monitor
      selector:
        device:
          integration: ksenia_lares
          entity:
            domain: binary_sensor

    notify_device:
      name: Device to notify
      description: Device that runs the Home Assistant app to receive notifications
      selector:
        device:
          integration: mobile_app

    notification_title:
      name: Notification title
      description: Title of the notification
      default: "🚪 Zone Opened"
      selector:
        text:

    notification_message:
      name: Notification message
      description: Message body of the notification
      default: "A monitored zone has been opened!"
      selector:
        text:
          multiline: true

    only_when_armed:
      name: Only notify when alarm is armed
      description: Only send notifications when the alarm system is armed
      default: false
      selector:
        boolean:

    alarm_device:
      name: Alarm Device (if filtering by armed state)
      description: The alarm control panel (required if 'Only when armed' is enabled)
      default: []
      selector:
        device:
          integration: ksenia_lares
          entity:
            domain: alarm_control_panel
          multiple: false

trigger:
  - platform: device
    device_id: !input zone_device
    domain: ksenia_lares
    type: zone_opened

condition:
  - condition: template
    value_template: >
      {% set only_armed = only_when_armed %}
      {% if not only_armed %}
        true
      {% else %}
        {% set alarm_dev = alarm_device %}
        {% if alarm_dev %}
          {% set entities = device_entities(alarm_dev) %}
          {% set alarm_entity = entities | select('match', 'alarm_control_panel') | list | first %}
          {{ states(alarm_entity) in ['armed_away', 'armed_home', 'armed_night'] }}
        {% else %}
          true
        {% endif %}
      {% endif %}

action:
  - service: notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}
    data:
      title: !input notification_title
      message: !input notification_message
      data:
        tag: ksenia_zone_opened

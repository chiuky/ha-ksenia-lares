blueprint:
  name: Ksenia Lares - Alarm Triggered Notification
  description: >
    Send a notification when the Ksenia Lares alarm is triggered.
    You can customize the notification message and choose which devices to notify.
  domain: automation
  source_url: https://github.com/chiuky/ha-ksenia-lares/blob/main/custom_components/ksenia_lares/blueprints/automation/alarm_triggered_notification.yaml

  input:
    alarm_device:
      name: Alarm Device
      description: The Ksenia Lares alarm control panel device
      selector:
        device:
          integration: ksenia_lares
          entity:
            domain: alarm_control_panel

    notify_device:
      name: Device to notify
      description: Device that runs the Home Assistant app to receive notifications
      selector:
        device:
          integration: mobile_app

    notification_title:
      name: Notification title
      description: Title of the notification
      default: "⚠️ Alarm Triggered!"
      selector:
        text:

    notification_message:
      name: Notification message
      description: Message body of the notification
      default: "The Ksenia Lares alarm has been triggered!"
      selector:
        text:
          multiline: true

    notification_action_view:
      name: Notification action (optional)
      description: Action when tapping the notification (e.g., open a camera view)
      default: ""
      selector:
        text:

trigger:
  - platform: device
    device_id: !input alarm_device
    domain: ksenia_lares
    type: alarm_triggered

action:
  - service: notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}
    data:
      title: !input notification_title
      message: !input notification_message
      data:
        tag: ksenia_alarm_triggered
        importance: high
        ttl: 0
        priority: high
        clickAction: !input notification_action_view
        actions:
          - action: "ALARM_DISARM"
            title: "Disarm Alarm"

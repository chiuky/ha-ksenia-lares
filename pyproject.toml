[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-ksenia-lares"
version = "2.0.5"
description = "Ksenia Lares Alarm integration for Home Assistant"
readme = "README.md"
authors = [
    { name = "Donato Chiuchiolo", email = "chiuky@users.noreply.github.com" },
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "homeassistant>=2024.1.0",
    "lxml>=5.1.0",
    "getmac==0.9.4",
    "async_timeout>=4.0.3",
]
keywords = [
    "homeassistant",
    "integration",
    "ksenia",
    "lares",
    "alarm",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/chiuky/ha-ksenia-lares"
Documentation = "https://github.com/chiuky/ha-ksenia-lares/blob/main/README.md"
"Issue Tracker" = "https://github.com/chiuky/ha-ksenia-lares/issues"
Repository = "https://github.com/chiuky/ha-ksenia-lares"

[project.optional-dependencies]
dev = [
    "homeassistant>=2025.11.3",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "ruff>=0.11.0",
    "pre-commit>=3.5.0",
    "colorlog>=6.7.0",
]

[tool.setuptools]
packages = ["custom_components.ksenia_lares"]

[tool.setuptools.package-data]
"custom_components.ksenia_lares" = [
    "manifest.json",
    "strings.json",
    "translations/*.json",
    "blueprints/**/*.yaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=custom_components.ksenia_lares --cov-report=term-missing --cov-report=html"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".git", ".ruff_cache", ".venv", "__pycache__", "config"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "Q",   # flake8-quotes
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"custom_components/ksenia_lares/**/*.py" = ["TID252"]

[tool.coverage.run]
source = ["custom_components/ksenia_lares"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# Global Pylint configuration
#[tool.pylint."MESSAGES CONTROL"]
#disable = ["broad-except"]
